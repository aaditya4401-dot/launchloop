name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      # --locked fails the build if pyproject.toml and uv.lock have drifted apart,
      # instead of silently re-resolving.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
